name: Trigger site build

# 只因内容、配置或站点资源变更而触发；修改说明文档不会触发发布。
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "config/**"
      - "data/**"
      - "assets/**"
      - "public/**"
      - "shirone.content.json"
  workflow_dispatch: {}

concurrency:
  group: trigger-build
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check dispatch token
        id: token
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Set DISPATCH_TOKEN to enable automatic site builds."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Notify code repository
        if: steps.token.outputs.configured == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: CyanYuzu/Hanaya
          event-type: content-updated
          client-payload: '{"sha": "${{ github.sha }}"}'
